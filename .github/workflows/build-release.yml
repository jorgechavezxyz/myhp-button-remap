name: Build and Release

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*.*.*'
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the current installer version
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Run tests
      run: dotnet test tests/HPButtonRemap.Tests/HPButtonRemap.Tests.csproj --configuration Release --filter "Category!=Desktop"

    - name: Run desktop tests (real windows)
      run: dotnet test tests/HPButtonRemap.Tests/HPButtonRemap.Tests.csproj --configuration Release --filter "Category=Desktop"

    - name: Publish app (framework-dependent single file)
      run: dotnet publish HPButtonRemap/HPButtonRemap.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true --output ./publish/app

    - name: Verify the release version
      id: version
      shell: pwsh
      run: |
        [xml]$project = Get-Content HPButtonRemap/HPButtonRemap.csproj -Raw
        $version = @($project.Project.PropertyGroup | ForEach-Object { $_.Version } | Where-Object { $_ })[0]
        if (-not $version) { throw "HPButtonRemap.csproj has no <Version>." }
        $tag = 'v' + $version
        if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne $tag) {
          throw "Tag $env:GITHUB_REF_NAME does not match installer version $tag."
        }
        Add-Content -Path $env:GITHUB_OUTPUT -Value "tag=$tag"
        Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version"

    - name: Build Windows x64 installer
      shell: pwsh
      run: |
        dotnet tool install wix --version 5.0.2 --tool-path "${{ runner.temp }}/wix"
        dotnet publish HPButtonRemap/HPButtonRemap.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/installer-app
        ./installer/build-msi.ps1 -AppDir publish/installer-app -Version "${{ steps.version.outputs.version }}" -Output publish/HPButtonRemapGUI-win-x64.msi -Wix "${{ runner.temp }}/wix/wix.exe"

    - name: Smoke test install, upgrade, uninstall, and reinstall
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # Upgrade from the latest published release when there is one.
        $previous = Join-Path $env:RUNNER_TEMP 'previous.msi'
        gh release download --repo "${{ github.repository }}" --pattern 'HPButtonRemapGUI-win-x64.msi' --output $previous
        if ($LASTEXITCODE) { $previous = $null }
        ./tests/smoke/smoke-test.ps1 -Msi publish/HPButtonRemapGUI-win-x64.msi -Exe publish/app/HPButtonRemap.exe -PreviousMsi $previous

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: HPButtonRemap-lightweight-${{ github.run_number }}
        path: |
          ./publish/app/HPButtonRemap.exe
          ./publish/HPButtonRemapGUI-win-x64.msi

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_release && github.ref == 'refs/heads/main')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        target_commitish: ${{ github.sha }}
        name: HP Button Remap GUI ${{ steps.version.outputs.tag }}
        fail_on_unmatched_files: true
        files: |
          ./publish/app/HPButtonRemap.exe
          ./publish/HPButtonRemapGUI-win-x64.msi
        body: |
          # HP Button Remap GUI

          Configure the HP logo key from the tray to open an app, a file, or an HTTP(S) website. Changes apply immediately.
          Run the unsigned Windows x64 MSI and follow the setup wizard to install for your account. It can open Settings when it finishes.
          The MSI includes the .NET Desktop Runtime. To uninstall, use "Uninstall HP Button Remap GUI" in the Start menu or Windows Settings → Apps → Installed apps.
          The standalone executable requires the .NET 10 Desktop Runtime.
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
