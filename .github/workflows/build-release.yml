name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_v1:
        description: Publish HP Button Remap GUI v1.0.0
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore app dependencies
      run: dotnet restore HPButtonRemap/HPButtonRemap.csproj

    - name: Build app (Release)
      run: dotnet build HPButtonRemap/HPButtonRemap.csproj --configuration Release --no-restore

    - name: Publish app (framework-dependent single file)
      run: dotnet publish HPButtonRemap/HPButtonRemap.csproj --configuration Release --runtime win-x64 --self-contained false -p:PublishSingleFile=true --output ./publish/app

    - name: Build Windows x64 installer
      shell: pwsh
      run: |
        dotnet tool install wix --version 5.0.2 --tool-path "${{ runner.temp }}/wix"
        dotnet publish HPButtonRemap/HPButtonRemap.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/installer-app
        $appDir = (Resolve-Path publish/installer-app).Path
        $output = Join-Path (Resolve-Path publish).Path "HPButtonRemapGUI-win-x64.msi"
        Push-Location installer
        & "${{ runner.temp }}/wix/wix.exe" build Package.wxs -arch x64 -d "AppDir=$appDir" -o $output
        if ($LASTEXITCODE) { exit $LASTEXITCODE }
        Pop-Location

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: HPButtonRemap-lightweight-${{ github.run_number }}
        path: |
          ./publish/app/HPButtonRemap.exe
          ./publish/HPButtonRemapGUI-win-x64.msi

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.publish_v1 && github.ref == 'refs/heads/main')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event_name == 'workflow_dispatch' && 'v1.0.0' || github.ref_name }}
        target_commitish: ${{ github.sha }}
        name: HP Button Remap GUI ${{ github.event_name == 'workflow_dispatch' && 'v1.0.0' || github.ref_name }}
        fail_on_unmatched_files: true
        files: |
          ./publish/app/HPButtonRemap.exe
          ./publish/HPButtonRemapGUI-win-x64.msi
        body: |
          # HP Button Remap GUI

          Configure the HP logo key from the tray to open an app, a file, or an HTTP(S) website. Changes apply immediately.
          Run the unsigned Windows x64 MSI to install for your account, then open HP Button Remap GUI from Start.
          The MSI includes the .NET Desktop Runtime. Remove it through Windows Settings → Apps → Installed apps.
          The standalone executable requires the .NET 8 Desktop Runtime.
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
